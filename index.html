<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Puentes - Clase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-2xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-amber-400">🌉 Registro de Puentes</h1>
      <p class="text-slate-400 text-sm mt-1">Aparta tu puente antes de ir a tomarte la foto. No se pueden repetir.</p>
      <div id="statusBadge" class="inline-block mt-3 px-3 py-1 rounded-full text-xs bg-slate-800 text-slate-400">
        Conectando a la base de datos...
      </div>
    </header>

    <!-- Formulario -->
    <form id="bridgeForm" class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4 mb-6">
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Tu Nombre y Apellido</label>
        <input type="text" id="studentName" required placeholder="Ej. Carlos Mendoza"
          class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Nombre del Puente</label>
        <input type="text" id="bridgeName" required placeholder="Ej. Puente Rojo / Puente El Cambio"
          class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Ubicación / Referencia</label>
        <input type="text" id="bridgeLocation" required placeholder="Ej. Vía a Pasaje, frente al parque..."
          class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-400 focus:outline-none">
      </div>

      <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium"></div>

      <button type="submit" id="submitBtn"
        class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition">
        Apartar Puente
      </button>
    </form>

    <!-- Buscador y Lista -->
    <div class="mb-4 flex items-center justify-between gap-2">
      <input type="text" id="searchInput" placeholder="🔍 Buscar puente o compañero..."
        class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:border-amber-400 focus:outline-none">
      <span id="counter" class="text-xs font-semibold bg-slate-800 px-3 py-2.5 rounded-lg border border-slate-700 whitespace-nowrap">
        0 apartados
      </span>
    </div>

    <div id="bridgeList" class="space-y-3"></div>
  </div>

  <script>
    const DB_URL = "https://registro-puentes-default-rtdb.firebaseio.com";

    let records = [];
    const form = document.getElementById('bridgeForm');
    const alertBox = document.getElementById('alertBox');
    const bridgeList = document.getElementById('bridgeList');
    const searchInput = document.getElementById('searchInput');
    const counter = document.getElementById('counter');
    const statusBadge = document.getElementById('statusBadge');
    const submitBtn = document.getElementById('submitBtn');

    function normalize(text) {
      return text
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\b(puente|el|la|los|las|de|del)\b/g, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();
    }

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `p-3 rounded-lg text-sm font-medium ${
        isError ? 'bg-red-950/80 border border-red-500 text-red-200' : 'bg-emerald-950/80 border border-emerald-500 text-emerald-200'
      }`;
      alertBox.classList.remove('hidden');
    }

    async function fetchBridges() {
      try {
        const res = await fetch(`${DB_URL}/puentes.json`);
        if (!res.ok) throw new Error("Error de conexión");
        const data = await res.json();
        records = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
        records.sort((a, b) => b.createdAt - a.createdAt);
        statusBadge.textContent = "🟢 Sincronizado en vivo";
        statusBadge.className = "inline-block mt-3 px-3 py-1 rounded-full text-xs bg-emerald-950 text-emerald-300 border border-emerald-800";
        renderList();
      } catch (err) {
        statusBadge.textContent = "🔴 Error al conectar con la base de datos";
        statusBadge.className = "inline-block mt-3 px-3 py-1 rounded-full text-xs bg-red-950 text-red-300";
      }
    }

    function renderList() {
      const q = searchInput.value.toLowerCase();
      const filtered = records.filter(r =>
        r.bridge.toLowerCase().includes(q) ||
        r.student.toLowerCase().includes(q) ||
        r.location.toLowerCase().includes(q)
      );

      counter.textContent = `${records.length} apartado${records.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        bridgeList.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Aún no hay puentes registrados. ¡Sé el primero!</p>`;
        return;
      }

      bridgeList.innerHTML = filtered.map(item => `
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex justify-between items-start gap-3">
          <div>
            <h3 class="font-bold text-amber-300 text-lg">${escapeHtml(item.bridge)}</h3>
            <p class="text-sm text-slate-300">📍 ${escapeHtml(item.location)}</p>
            <p class="text-xs text-slate-400 mt-1">👤 Apartado por: <span class="text-slate-200 font-medium">${escapeHtml(item.student)}</span></p>
          </div>
          <button onclick="deleteBridge('${item.id}', '${escapeHtml(item.student)}')"
            class="text-xs text-slate-400 hover:text-red-400 px-2 py-1 rounded border border-slate-700 hover:border-red-500/50 transition">
            Borrar
          </button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[m]));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const student = document.getElementById('studentName').value.trim();
      const bridge = document.getElementById('bridgeName').value.trim();
      const location = document.getElementById('bridgeLocation').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Verificando disponibilidad...";

      await fetchBridges();

      const normNew = normalize(bridge);
      const duplicate = records.find(r => {
        const normExisting = normalize(r.bridge);
        return normExisting === normNew || (normNew.length > 3 && (normExisting.includes(normNew) || normNew.includes(normExisting)));
      });

      if (duplicate) {
        showAlert(`❌ Error: El puente "${duplicate.bridge}" ya fue apartado por ${duplicate.student}. Elige otro puente.`);
        submitBtn.disabled = false;
        submitBtn.textContent = "Apartar Puente";
        return;
      }

      try {
        const res = await fetch(`${DB_URL}/puentes.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student, bridge, location, createdAt: Date.now() })
        });
        if (!res.ok) throw new Error();
        form.reset();
        showAlert(`✅ ¡Listo! Apartaste "${bridge}" a nombre de ${student}.`, false);
        await fetchBridges();
      } catch {
        showAlert("❌ No se pudo guardar. Revisa tu conexión.");
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Apartar Puente";
    });

    async function deleteBridge(id, studentName) {
      if (!confirm(`¿Seguro que quieres eliminar el registro de ${studentName}?`)) return;
      await fetch(`${DB_URL}/puentes/${id}.json`, { method: 'DELETE' });
      await fetchBridges();
    }

    searchInput.addEventListener('input', renderList);

    fetchBridges();
    setInterval(fetchBridges, 5000);
  </script>
</body>
</html>
